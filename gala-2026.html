            <p>Venez célébrer la danse et le talent de nos élèves lors de notre grand gala annuel ! Une soirée placée sous le signe du partage, de l’émotion et de la passion, avec des chorégraphies variées et des performances préparées tout au long de l’année. Un spectacle à ne pas manquer !</p>
